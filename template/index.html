<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Goxfer</title>
    <style>
      :root {
        --bg: #000000;
        --card: #111111;
        --text: #ffffff;
        --accent: #00ff9d;
        --accent-dim: rgba(0, 255, 157, 0.1);
        --error: #ff4444;
      }

      body {
        background-color: var(--bg);
        color: var(--text);
        font-family: "Courier New", Courier, monospace; /* Hacker vibe */
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        width: 100%;
        max-width: 400px;
        text-align: center;
      }

      h1 {
        font-size: 2.5rem;
        margin-bottom: 0.5rem;
        letter-spacing: -2px;
      }

      h1 span {
        color: var(--accent);
      }

      p.subtitle {
        color: #666;
        margin-bottom: 3rem;
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 2px;
      }

      .drop-zone {
        border: 1px dashed #333;
        border-radius: 0;
        padding: 60px 20px;
        cursor: pointer;
        transition: all 0.3s ease;
        background: var(--card);
        position: relative;
        overflow: hidden;
      }

      .drop-zone:hover,
      .drop-zone.dragover {
        border-color: var(--accent);
        background: var(--accent-dim);
      }

      .drop-zone::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--accent),
          transparent
        );
        transform: translateX(-100%);
        transition: transform 0.5s;
      }

      .drop-zone:hover::before {
        transform: translateX(100%);
        transition: transform 1s;
      }

      .icon {
        font-size: 32px;
        margin-bottom: 15px;
        display: block;
        opacity: 0.7;
      }

      #status {
        margin-top: 30px;
        font-size: 0.8rem;
        color: #444;
        min-height: 20px;
      }

      .progress-bar {
        width: 100%;
        height: 2px;
        background-color: #222;
        margin-top: 20px;
        display: none;
      }

      .progress-fill {
        height: 100%;
        background-color: var(--accent);
        width: 0%;
        box-shadow: 0 0 10px var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Go<span>xfer</span></h1>
      <p class="subtitle">Secure Local Link</p>

      <div id="drop-zone" class="drop-zone">
        <span class="icon">⚡</span>
        <span>DROP FILES</span>
      </div>

      <input type="file" id="fileInput" style="display: none" />

      <div id="progress-container" class="progress-bar">
        <div id="progress-fill" class="progress-fill"></div>
      </div>

      <p id="status">WAITING FOR CONNECTION...</p>
    </div>

    <script>
      const dropZone = document.getElementById("drop-zone");
      const fileInput = document.getElementById("fileInput");
      const status = document.getElementById("status");
      const progressContainer = document.getElementById("progress-container");
      const progressFill = document.getElementById("progress-fill");

      dropZone.onclick = () => fileInput.click();

      dropZone.ondragover = (e) => {
        e.preventDefault();
        dropZone.classList.add("dragover");
      };

      dropZone.ondragleave = () => {
        dropZone.classList.remove("dragover");
      };

      dropZone.ondrop = (e) => {
        e.preventDefault();
        dropZone.classList.remove("dragover");
        if (e.dataTransfer.files.length) {
          upload(e.dataTransfer.files[0]);
        }
      };

      fileInput.onchange = () => {
        if (fileInput.files.length) {
          upload(fileInput.files[0]);
        }
      };

      function upload(file) {
        let fd = new FormData();
        fd.append("file", file);

        status.innerText = `UPLOADING ${file.name.toUpperCase()}...`;
        status.style.color = "#fff";
        progressContainer.style.display = "block";
        progressFill.style.width = "0%";

        let xhr = new XMLHttpRequest();
        xhr.open("POST", "/upload");

        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable) {
            let percent = (e.loaded / e.total) * 100;
            progressFill.style.width = percent + "%";
          }
        };

        xhr.onload = () => {
          if (xhr.status === 200) {
            status.innerText = "TRANSFER COMPLETE";
            status.style.color = "var(--accent)";
            setTimeout(() => {
              progressContainer.style.display = "none";
              status.innerText = "WAITING FOR CONNECTION...";
              status.style.color = "#444";
            }, 3000);
          } else {
            status.innerText = "UPLOAD FAILED";
            status.style.color = "var(--error)";
          }
        };

        xhr.send(fd);
      }

      async function poll() {
        try {
          let res = await fetch("/poll");
          if (res.status === 502) {
            await new Promise((r) => setTimeout(r, 1000));
            poll();
            return;
          }
          let data = await res.json();
          if (data.url) {
            status.innerText = "INCOMING FILE...";
            status.style.color = "var(--accent)";

            const link = document.createElement("a");
            link.href = data.url;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            setTimeout(() => {
              status.innerText = "WAITING FOR CONNECTION...";
              status.style.color = "#444";
            }, 3000);
          }
        } catch (e) {
          await new Promise((r) => setTimeout(r, 2000));
        }
        poll();
      }
      poll();
    </script>
  </body>
</html>
